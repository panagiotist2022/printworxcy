<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="PRINTWORXCY — Creative design, branding and digital experiences for ambitious businesses worldwide.">
  <title>PRINTWORXCY | Creative Design Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#090909;--panel:#111;--gold:#c9a45c;--gold2:#e4c987;--white:#f7f5f0;--muted:#aaa69e;--line:rgba(255,255,255,.12)}
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth;scroll-padding-top:85px}
    body{background:var(--bg);color:var(--white);font-family:'DM Sans',sans-serif;line-height:1.65}
    a{color:inherit;text-decoration:none}
    button,select,input,textarea{font:inherit}
    .container{width:min(1160px,90%);margin:auto}
    .gold{color:var(--gold)}
    .eyebrow{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:16px}
    h1,h2,h3{font-family:Manrope,sans-serif;line-height:1.12}
    h2{font-size:clamp(32px,5vw,54px);letter-spacing:-1.8px}
    .muted{color:var(--muted)}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 22px;background:var(--gold);color:#090909;border:1px solid var(--gold);font-weight:700;font-size:13px;transition:.2s;cursor:pointer}
    .btn:hover{background:var(--gold2);transform:translateY(-2px)}
    .btn-outline{background:transparent;color:var(--white);border-color:rgba(255,255,255,.3)}
    .btn-outline:hover{background:var(--gold);color:#090909}
    header{position:fixed;inset:0 0 auto;z-index:50;background:rgba(9,9,9,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
    .nav{height:76px;display:flex;align-items:center;justify-content:space-between;gap:24px}
    .brand{font:800 23px Manrope,sans-serif;letter-spacing:-1px;white-space:nowrap}
    .brand span{color:var(--gold)}
    .nav-right{display:flex;align-items:center;gap:28px}
    .links{display:flex;align-items:center;gap:25px;list-style:none}
    .links a{font-size:12px;color:#d7d3cb}
    .links a:hover{color:var(--gold)}
    .language{background:#151515;color:var(--white);border:1px solid var(--line);padding:9px 11px;font-size:12px;outline:none}
    .menu{display:none;background:none;border:0;color:white;font-size:26px;cursor:pointer}
    .hero{min-height:720px;display:flex;align-items:center;padding:150px 0 85px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 78% 42%,rgba(201,164,92,.13),transparent 38%),linear-gradient(120deg,#090909 55%,#15120c)}
    .hero:after{content:"";position:absolute;width:520px;height:520px;border:1px solid rgba(201,164,92,.15);border-radius:50%;right:-180px;top:110px;box-shadow:0 0 0 55px rgba(201,164,92,.025),0 0 0 110px rgba(201,164,92,.018)}
    .hero-content{position:relative;z-index:1;max-width:820px}
    .hero h1{font-size:clamp(48px,8vw,92px);letter-spacing:-4px;margin-bottom:25px}
    .hero h1 span{color:var(--gold)}
    .hero p{max-width:570px;color:#b8b3a9;font-size:17px;margin-bottom:30px}
    .actions{display:flex;gap:12px;flex-wrap:wrap}
    .hero-tags{display:flex;gap:28px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:75px;padding-top:22px;color:#aaa59b;text-transform:uppercase;letter-spacing:1.5px;font-size:10px}
    section{padding:100px 0}
    .about-grid{display:grid;grid-template-columns:1fr;gap:0;align-items:center}
    .about-copy{max-width:850px;margin:0 auto;text-align:center}
    .about-copy h2{font-size:clamp(36px,5.5vw,60px);margin-bottom:22px}
    .about-copy p{color:var(--muted);font-size:17px;line-height:1.8;margin:0 auto 18px;max-width:780px}
    .about-copy .btn{margin-top:12px}
    .services{background:#0e0e0e}
    .section-head{max-width:650px;margin-bottom:42px}
    .section-head h2{margin-bottom:15px}
    .service-list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .service{padding:25px 24px;background:#131313;border:1px solid var(--line);min-height:135px;transition:.2s}
    .service:hover{border-color:var(--gold);transform:translateY(-3px)}
    .service small{display:block;color:var(--gold);font-size:10px;letter-spacing:2px;margin-bottom:15px}
    .service h3{font-size:19px;margin-bottom:7px}
    .service p{font-size:12px;color:var(--muted)}
    .quote-band{padding:75px 0;text-align:center;background:linear-gradient(100deg,#17130d,#0c0c0c,#17130d);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    .quote-mark{font:italic 500 clamp(24px,4vw,40px) Manrope,sans-serif;max-width:900px;margin:auto;letter-spacing:-1px}
    .quote-caption{margin-top:15px;color:var(--gold);font-size:10px;letter-spacing:3px;text-transform:uppercase}
    .portfolio{background:#090909}
    .portfolio-top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:32px}
    .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
    .filter{padding:8px 13px;background:transparent;color:#c9c4ba;border:1px solid var(--line);font-size:11px;cursor:pointer}
    .filter.active,.filter:hover{background:var(--gold);color:#090909;border-color:var(--gold)}
    .gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    .work{position:relative;aspect-ratio:4/3;width:100%;min-width:0;overflow:hidden;background:#171717;border:1px solid var(--line)}
    .work img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;filter:saturate(.9);transition:transform .45s}
    .work:hover img{transform:scale(1.025)}
    .work-label{position:absolute;inset:auto 0 0;padding:35px 17px 15px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:13px;font-weight:600}
    .work[hidden]{display:none}
    .process{background:#101010}
    .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
    .step{border-top:1px solid var(--gold);padding-top:17px}
    .step small{color:var(--gold);letter-spacing:2px;font-size:10px}
    .step h3{font-size:18px;margin:13px 0 8px}
    .step p{font-size:12px;color:var(--muted)}
    .cta{text-align:center;background:radial-gradient(ellipse at center,rgba(201,164,92,.12),transparent 65%)}
    .cta h2{max-width:760px;margin:0 auto 18px}
    .cta p{max-width:550px;margin:0 auto 26px;color:var(--muted)}
    .contact{background:#101010}
    .contact-grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:60px}
    .contact-info h2{margin-bottom:17px}
    .contact-info p{color:var(--muted)}
    .detail{margin-top:25px}
    .detail small{display:block;color:var(--gold);font-size:10px;letter-spacing:2px;text-transform:uppercase}
    .detail a{font-size:15px}
    form{display:grid;gap:12px}
    input,textarea{width:100%;padding:15px;background:#181818;color:white;border:1px solid var(--line);outline:none}
    input:focus,textarea:focus{border-color:var(--gold)}
    textarea{min-height:130px;resize:vertical}
    form button{justify-self:start}
    footer{border-top:1px solid var(--line);padding:25px 0}
    .footer-inner{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
    footer p,footer a{font-size:11px;color:var(--muted)}
    .footer-links{display:flex;gap:18px}
    [dir="rtl"] body{font-family:Arial,sans-serif}
    [dir="rtl"] .hero h1,[dir="rtl"] h2,[dir="rtl"] h3{letter-spacing:0}
    @media(max-width:850px){
      .menu{display:block}.nav-right{gap:12px}.links{display:none;position:absolute;top:76px;left:0;right:0;background:#101010;padding:22px 5%;border-bottom:1px solid var(--line);flex-direction:column;align-items:flex-start}
      .links.open{display:flex}.contact-grid{grid-template-columns:1fr;gap:35px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.service-list{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:repeat(2,1fr)}
    }
    @media(max-width:560px){
      section{padding:72px 0}.hero{min-height:auto;padding:140px 0 65px}.hero h1{letter-spacing:-2px}.hero-tags{gap:12px;margin-top:50px}.service-list{grid-template-columns:1fr 1fr}.work{min-height:0}.portfolio-top{display:block}.steps{grid-template-columns:1fr 1fr}
    }
    @media(max-width:380px){.service-list,.gallery{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header>
  <div class="container nav">
    <a class="brand" href="#home">PRINTWORX<span>CY</span></a>
    <div class="nav-right">
      <ul class="links" id="navLinks">
        <li><a href="#about" data-i18n="navAbout">About</a></li>
        <li><a href="#services" data-i18n="navServices">Services</a></li>
        <li><a href="#portfolio" data-i18n="navPortfolio">Portfolio</a></li>
        <li><a href="#contact" data-i18n="navContact">Contact</a></li>
      </ul>
      <select class="language" id="language" aria-label="Choose language">
        <option value="en">EN</option><option value="el">ΕΛ</option><option value="de">DE</option><option value="fr">FR</option><option value="zh">中文</option><option value="ar">عربي</option>
      </select>
      <button class="menu" id="menu" aria-label="Menu">☰</button>
    </div>
  </div>
</header>
